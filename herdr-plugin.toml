id = "imontes.herdr-web-service"
name = "Herdr Web Service"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Chat-style web client for Herdr agents, with real login and HTTPS, built to run on a public VPS with zero manual setup"
platforms = ["linux", "macos"]

# Build runs only on `herdr plugin install` (GitHub). `herdr plugin link` skips it:
# run `bun install && bun run build` yourself in a local checkout.
[[build]]
command = ["sh", "scripts/bun.sh", "install", "--frozen-lockfile"]

[[build]]
command = ["sh", "scripts/bun.sh", "run", "build"]

# One-shot after every Herdr start: bring the server up if it is not already answering.
[[startup]]
command = ["sh", "scripts/bun.sh", "scripts/plugin.ts", "start"]

[[actions]]
id = "start"
title = "Web: start server"
contexts = ["global", "workspace"]
command = ["sh", "scripts/bun.sh", "scripts/plugin.ts", "start"]

[[actions]]
id = "stop"
title = "Web: stop server"
contexts = ["global", "workspace"]
command = ["sh", "scripts/bun.sh", "scripts/plugin.ts", "stop"]

[[actions]]
id = "status"
title = "Web: status"
contexts = ["global", "workspace"]
command = ["sh", "scripts/bun.sh", "scripts/plugin.ts", "status"]

[[actions]]
id = "setup"
title = "Web: setup (password, domain, HTTPS)"
contexts = ["global", "workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint setup --focus"]

[[actions]]
id = "uninstall"
title = "Web: uninstall (service and tunnel; keeps password and config)"
contexts = ["global", "workspace"]
command = ["sh", "scripts/bun.sh", "scripts/plugin.ts", "uninstall"]

[[panes]]
id = "setup"
title = "Herdr Web Service setup"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "scripts/bun.sh", "scripts/plugin.ts", "setup"]
